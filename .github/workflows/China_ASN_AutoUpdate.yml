name: Update China ASN

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Fetch China ASN
        run: |
          set -e

          python3 - <<'PY'
          import re
          import requests
          from bs4 import BeautifulSoup

          URL = "https://bgp.he.net/country/CN"
          OUTPUT = "China_ASN.list"

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/140.0.0.0 Safari/537.36"
              )
          }

          response = requests.get(
              URL,
              headers=headers,
              timeout=60
          )

          response.raise_for_status()

          soup = BeautifulSoup(response.text, "html.parser")

          asns = set()

          # 优先从 ASN 链接提取
          for a in soup.find_all("a", href=True):
              text = a.get_text(" ", strip=True)
              href = a.get("href", "")

              match = re.fullmatch(
                  r"AS(\d+)",
                  text,
                  re.IGNORECASE
              )

              if match and re.search(
                  r"/AS\d+",
                  href,
                  re.IGNORECASE
              ):
                  asns.add(int(match.group(1)))

          # 页面结构变化时使用 HTML 兜底提取
          if not asns:
              matches = re.findall(
                  r"\bAS(\d+)\b",
                  response.text,
                  re.IGNORECASE
              )

              for number in matches:
                  asns.add(int(number))

          if not asns:
              raise RuntimeError(
                  "没有抓取到任何 ASN，停止更新，避免覆盖现有规则集。"
              )

          asns = sorted(asns)

          with open(
              OUTPUT,
              "w",
              encoding="utf-8",
              newline="\n"
          ) as f:
              for asn in asns:
                  f.write(f"IP-ASN,{asn},CN\n")

          print(f"China ASN count: {len(asns)}")
          print(f"Output: {OUTPUT}")
          PY

      - name: Show result
        run: |
          echo "===== China ASN ====="
          wc -l China_ASN.list
          echo
          head -20 China_ASN.list
          echo
          echo "..."
          echo
          tail -20 China_ASN.list

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add China_ASN.list

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update China ASN ruleset"
            git push
          fi

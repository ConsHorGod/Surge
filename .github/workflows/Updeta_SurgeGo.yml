name: Update_SurgeGo_[HOST]&[real-ip]

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Crawl official business domains and update SurgeGo.conf
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -e

          python3 <<'PY'
          import json
          import re
          import time
          from pathlib import Path
          from urllib.parse import urljoin, urlparse, urldefrag

          import requests
          from bs4 import BeautifulSoup

          CONFIG = Path("SurgeGo.conf")
          STATE = Path(".github/surgego_auto_domains.json")

          USER_AGENT = (
              "Mozilla/5.0 (X11; Linux x86_64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/140.0 Safari/537.36"
          )

          SESSION = requests.Session()
          SESSION.headers.update({
              "User-Agent": USER_AGENT,
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          TIMEOUT = 15
          MAX_PAGES = 80
          MAX_DEPTH = 2

          # 只排除明显的第三方基础设施/社交/统计/广告域名。
          # 不包含任何公司的业务域名。
          BLOCKED_ROOTS = {
              "google.com",
              "googleapis.com",
              "gstatic.com",
              "googleusercontent.com",
              "facebook.com",
              "instagram.com",
              "youtube.com",
              "twitter.com",
              "x.com",
              "linkedin.com",
              "tiktok.com",
              "doubleclick.net",
              "googletagmanager.com",
              "google-analytics.com",
              "googlesyndication.com",
              "cloudflare.com",
              "cloudflareinsights.com",
              "jsdelivr.net",
              "unpkg.com",
              "cdnjs.com",
              "sentry.io",
              "hotjar.com",
              "clarity.ms",
              "baidu.com",
              "cnzz.com",
              "umeng.com",
              "aliyuncs.com",
              "alicdn.com",
              "qiniudn.com",
              "qiniu.com",
              "oss-cn.com",
              "akamaized.net",
              "akamaihd.net",
              "amazonaws.com",
              "amazonaws.com.cn",
              "cloudfront.net",
              "fastly.net",
          }

          # 官方业务/产品目录入口。
          # 这里写的是“官方目录页面”，不是公司域名白名单。
          SOURCES = {
              "Alibaba": {
                  "resolver": "223.5.5.5",
                  "urls": [
                      "https://www.alibabagroup.com/zh-CN",
                      "https://www.alibabagroup.com/en-US",
                  ],
              },

              "Tencent": {
                  "resolver": "119.29.29.29",
                  "urls": [
                      "https://www.tencent.com/what-we-create/",
                      "https://www.tencent.com/zh-cn/what-we-create/everything-we-create/",
                  ],
              },

              "ByteDance": {
                  "resolver": "server:syslib",
                  "urls": [
                      "https://www.bytedance.com/",
                      "https://www.bytedance.com/en/products",
                  ],
              },

              "JD": {
                  "resolver": "119.29.29.29",
                  "urls": [
                      "https://www.jd.com/",
                      "https://app.jd.com/index.html",
                  ],
              },

              "Meituan": {
                  "resolver": "119.29.29.29",
                  "urls": [
                      "https://www.meituan.com/",
                  ],
              },

              "Apple": {
                  "resolver": "server:syslib",
                  "urls": [
                      "https://www.apple.com.cn/",
                      "https://www.apple.com.cn/store",
                      "https://support.apple.com/zh-cn",
                  ],
              },

              "Kuaishou": {
                  "resolver": "server:syslib",
                  "urls": [
                      "https://www.kuaishou.com/",
                      "https://www.kuaishou.com/cn",
                  ],
              },

              "Xiaohongshu": {
                  "resolver": "server:syslib",
                  "urls": [
                      "https://www.xiaohongshu.com/",
                  ],
              },

              "ChinaUnionPay": {
                  "resolver": "server:syslib",
                  "urls": [
                      "https://cn.unionpay.com/",
                      "https://www.unionpay.com/upowhtml/cn/templates/index/index.html",
                      "https://open.unionpay.com/ajweb/productStore",
                  ],
              },
          }

          # 常见公共后缀。
          # 这里不是公司域名，只用于把子域名归并到注册域。
          TWO_LEVEL_SUFFIXES = {
              "com.cn",
              "net.cn",
              "org.cn",
              "gov.cn",
              "edu.cn",
              "co.uk",
              "org.uk",
              "com.hk",
              "com.tw",
              "com.sg",
              "com.au",
              "co.jp",
              "co.kr",
              "com.my",
              "com.br",
              "com.mx",
              "co.in",
              "com.tr",
              "co.nz",
          }

          def root_domain(host):
              host = host.lower().strip(".")
              if not host:
                  return ""

              if re.match(r"^\d+\.\d+\.\d+\.\d+$", host):
                  return ""

              parts = host.split(".")

              if len(parts) < 2:
                  return host

              suffix2 = ".".join(parts[-2:])

              if suffix2 in TWO_LEVEL_SUFFIXES and len(parts) >= 3:
                  return ".".join(parts[-3:])

              return suffix2

          def valid_host(host):
              if not host:
                  return False

              host = host.lower().strip(".")

              if len(host) > 253:
                  return False

              if host == "localhost":
                  return False

              if host.startswith("www."):
                  host = host[4:]

              root = root_domain(host)

              if not root:
                  return False

              if root in BLOCKED_ROOTS:
                  return False

              # 明显静态资源域名不作为业务域名。
              bad_prefixes = (
                  "static.",
                  "cdn.",
                  "img.",
                  "image.",
                  "images.",
                  "assets.",
                  "asset.",
                  "media.",
                  "video.",
                  "download.",
                  "downloads.",
                  "fonts.",
                  "font.",
                  "js.",
                  "css.",
              )

              if host.startswith(bad_prefixes):
                  return False

              # 明显文件资源 URL 不处理。
              return True

          def normalize_url(base, href):
              if not href:
                  return None

              href = href.strip()

              if href.startswith((
                  "#",
                  "javascript:",
                  "mailto:",
                  "tel:",
                  "data:",
                  "blob:",
              )):
                  return None

              url = urljoin(base, href)
              url, _ = urldefrag(url)

              parsed = urlparse(url)

              if parsed.scheme not in ("http", "https"):
                  return None

              if not parsed.hostname:
                  return None

              return url

          def fetch(url):
              try:
                  r = SESSION.get(
                      url,
                      timeout=TIMEOUT,
                      allow_redirects=True,
                  )

                  if r.status_code >= 400:
                      return None, None

                  content_type = r.headers.get("content-type", "").lower()

                  if "text/html" not in content_type and "application/xhtml" not in content_type:
                      return None, None

                  if len(r.content) > 5 * 1024 * 1024:
                      return None, None

                  return r.url, r.text

              except Exception:
                  return None, None

          def extract_page(url, html):
              soup = BeautifulSoup(html, "html.parser")

              for tag in soup(["script", "style", "noscript", "svg"]):
                  tag.decompose()

              title = soup.title.get_text(" ", strip=True) if soup.title else ""

              h1 = " ".join(
                  x.get_text(" ", strip=True)
                  for x in soup.find_all(["h1", "h2"])
              )

              text = soup.get_text(" ", strip=True)

              links = []

              for a in soup.find_all("a", href=True):
                  href = normalize_url(url, a.get("href"))
                  if not href:
                      continue

                  anchor = a.get_text(" ", strip=True)

                  links.append((href, anchor))

              # canonical / og:url / JSON-LD URL 也属于官方页面自身业务地址。
              canonical = soup.find("link", rel=lambda x: x and "canonical" in x)
              if canonical and canonical.get("href"):
                  u = normalize_url(url, canonical["href"])
                  if u:
                      links.append((u, "canonical"))

              og = soup.find("meta", property="og:url")
              if og and og.get("content"):
                  u = normalize_url(url, og["content"])
                  if u:
                      links.append((u, "og:url"))

              return title, h1, text, links

          def same_root(a, b):
              return root_domain(urlparse(a).hostname or "") == root_domain(
                  urlparse(b).hostname or ""
              )

          def candidate_is_business(source_url, target_url, anchor, title, h1, text):
              source_host = urlparse(source_url).hostname or ""
              target_host = urlparse(target_url).hostname or ""

              source_root = root_domain(source_host)
              target_root = root_domain(target_host)

              if not target_root:
                  return False

              if target_root in BLOCKED_ROOTS:
                  return False

              # 官方站内部链接天然有效。
              if source_root == target_root:
                  return True

              # 外部域名只有在官方业务目录明确链接过去时才接受。
              # 需要目标页面本身存在业务身份信号。
              anchor_clean = re.sub(r"\s+", "", anchor.lower())
              title_clean = re.sub(r"\s+", "", title.lower())
              h1_clean = re.sub(r"\s+", "", h1.lower())

              if anchor_clean and len(anchor_clean) >= 2:
                  if anchor_clean in title_clean or anchor_clean in h1_clean:
                      return True

              # 如果目标页 title/h1 有明确内容，同时它不是明显的资源页，
              # 允许作为官方业务入口。
              if title.strip() and len(title.strip()) >= 2:
                  if any(
                      x in title_clean
                      for x in (
                          "official",
                          "official website",
                          "官网",
                          "官方网站",
                      )
                  ):
                      return True

              return False

          def crawl_company(name, info):
              discovered = set()
              queue = []

              for seed in info["urls"]:
                  queue.append((seed, 0))

              visited = set()

              pages = 0

              while queue and pages < MAX_PAGES:
                  url, depth = queue.pop(0)

                  parsed = urlparse(url)
                  host = parsed.hostname or ""

                  if not host:
                      continue

                  normalized = f"{parsed.scheme}://{host}{parsed.path}"
                  if parsed.query:
                      normalized += "?" + parsed.query

                  if normalized in visited:
                      continue

                  visited.add(normalized)

                  final_url, html = fetch(url)

                  if not html:
                      continue

                  pages += 1

                  final_host = urlparse(final_url).hostname or ""

                  if valid_host(final_host):
                      discovered.add(root_domain(final_host))

                  title, h1, text, links = extract_page(final_url, html)

                  for target, anchor in links:
                      target_host = urlparse(target).hostname or ""

                      if not valid_host(target_host):
                          continue

                      target_root = root_domain(target_host)

                      if candidate_is_business(
                          final_url,
                          target,
                          anchor,
                          title,
                          h1,
                          text,
                      ):
                          discovered.add(target_root)

                          if depth < MAX_DEPTH:
                              queue.append((target, depth + 1))

                  time.sleep(0.15)

              return sorted(discovered)

          # ---------------------------
          # 读取上一轮状态
          # ---------------------------

          if STATE.exists():
              try:
                  old_state = json.loads(STATE.read_text(encoding="utf-8"))
              except Exception:
                  old_state = {}
          else:
              old_state = {}

          new_state = {}
          success_count = 0

          for company, info in SOURCES.items():
              print(f"\n========== {company} ==========")

              domains = crawl_company(company, info)

              # 删除明显无意义结果。
              domains = sorted({
                  d for d in domains
                  if d and d not in BLOCKED_ROOTS
              })

              if domains:
                  new_state[company] = {
                      "resolver": info["resolver"],
                      "domains": domains,
                  }

                  success_count += 1

                  print(f"发现 {len(domains)} 个域名:")
                  for d in domains:
                      print("  ", d)

              else:
                  print("本次抓取失败或没有有效业务域名，保留上一轮结果。")

                  if company in old_state:
                      new_state[company] = old_state[company]

          if success_count == 0:
              raise RuntimeError("9 家公司的官方业务目录全部抓取失败，停止修改 SurgeGo.conf")

          # ---------------------------
          # 汇总本轮自动域名
          # ---------------------------

          auto_domains = {}

          for company, data in new_state.items():
              resolver = data["resolver"]

              for domain in data["domains"]:
                  auto_domains[f"*.{domain}"] = resolver

          print("\n========== 最终自动域名 ==========")

          for key in sorted(auto_domains):
              print(key, "=", auto_domains[key])

          # ---------------------------
          # 保存状态
          # ---------------------------

          STATE.parent.mkdir(parents=True, exist_ok=True)

          STATE.write_text(
              json.dumps(
                  new_state,
                  ensure_ascii=False,
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )

          # ---------------------------
          # 读取 SurgeGo.conf
          # ---------------------------

          if not CONFIG.exists():
              raise RuntimeError("找不到 SurgeGo.conf")

          content = CONFIG.read_text(encoding="utf-8")

          # 统一换行。
          content = content.replace("\r\n", "\n").replace("\r", "\n")

          lines = content.split("\n")

          # ---------------------------
          # 获取上一轮自动域名
          # ---------------------------

          old_auto_keys = set()

          for company, data in old_state.items():
              for domain in data.get("domains", []):
                  old_auto_keys.add(f"*.{domain}")

          new_auto_keys = set(auto_domains.keys())

          # 第一次运行时：
          # 对明显属于自动公司域名的 wildcard Host 做一次清理。
          #
          # 不碰：
          # dns.alidns.com
          # doh.pub
          # *.lan
          # *.local
          # *.asuscomm.com
          # *.wicp.net
          # NTP
          # *.cn
          #
          # 仅针对当前 resolver 对应的 wildcard 域名。
          company_resolvers = {
              "223.5.5.5",
              "119.29.29.29",
              "server:syslib",
          }

          known_manual = {
              "*.lan",
              "*.local",
              "*.asuscomm.com",
              "*.wicp.net",
              "*.cn",
              "*.pool.ntp.org",
          }

          def parse_host_key(line):
              if "=" not in line:
                  return None

              left = line.split("=", 1)[0].strip()

              if not left:
                  return None

              return left

          # ---------------------------
          # 定位 [Host]
          # ---------------------------

          host_start = None
          host_end = None

          for i, line in enumerate(lines):
              if line.strip().lower() == "[host]":
                  host_start = i
                  break

          if host_start is None:
              raise RuntimeError("SurgeGo.conf 中找不到 [Host]")

          for i in range(host_start + 1, len(lines)):
              stripped = lines[i].strip()

              if stripped.startswith("[") and stripped.endswith("]"):
                  host_end = i
                  break

          if host_end is None:
              host_end = len(lines)

          host_lines = lines[host_start + 1:host_end]

          # ---------------------------
          # 清除旧自动 Host
          # ---------------------------

          cleaned_host = []

          for line in host_lines:
              stripped = line.strip()

              if not stripped:
                  continue

              key = parse_host_key(stripped)

              if key in old_auto_keys:
                  continue

              # 第一次没有 state 时，清理明显 wildcard 自动项。
              if not old_auto_keys and "=" in stripped:
                  value = stripped.split("=", 1)[1].strip()

                  if (
                      key
                      and key.startswith("*.")
                      and key not in known_manual
                      and value in company_resolvers
                  ):
                      continue

              # *.cn 必须始终最后处理。
              if key == "*.cn":
                  continue

              cleaned_host.append(stripped)

          # ---------------------------
          # 添加新的自动 Host
          # ---------------------------

          for key in sorted(new_auto_keys):
              resolver = auto_domains[key]

              # 避免覆盖固定手工配置。
              if key in {
                  "*.lan",
                  "*.local",
                  "*.asuscomm.com",
                  "*.wicp.net",
                  "*.cn",
              }:
                  continue

              cleaned_host.append(f"{key} = {resolver}")

          # *.cn 永远最后
          cleaned_host.append("*.cn = server:syslib")

          # 去重，同时保持顺序。
          final_host = []
          seen = set()

          for line in cleaned_host:
              line = line.strip()

              if not line:
                  continue

              key = parse_host_key(line)

              identity = key if key else line

              if identity in seen:
                  continue

              seen.add(identity)
              final_host.append(line)

          # ---------------------------
          # 写回 [Host]
          # ---------------------------

          lines = (
              lines[:host_start + 1]
              + final_host
              + lines[host_end:]
          )

          # ---------------------------
          # 更新 always-real-ip
          # ---------------------------

          old_auto_real = old_auto_keys

          new_real = sorted(new_auto_keys)

          real_index = None

          for i, line in enumerate(lines):
              if line.strip().startswith("always-real-ip"):
                  real_index = i
                  break

          if real_index is not None:
              line = lines[real_index]

              if "=" in line:
                  prefix = line.split("=", 1)[0].strip()

                  current = line.split("=", 1)[1].strip()

                  current_items = [
                      x.strip()
                      for x in current.split(",")
                      if x.strip()
                  ]

                  # 删除上一轮自动域名。
                  current_items = [
                      x for x in current_items
                      if x not in old_auto_real
                  ]

                  # 第一次运行，没有 state 时，
                  # 清理对应 resolver 生成的 wildcard 项无法从
                  # always-real-ip 判断 resolver，因此只清理当前
                  # 新生成集合和旧 state。
                  current_items = [
                      x for x in current_items
                      if x not in new_auto_keys
                  ]

                  # 强制保留用户要求的顺序。
                  fixed_prefix = [
                      "%INSERT%",
                      "*.lan",
                      "*.cn",
                  ]

                  current_items = [
                      x for x in current_items
                      if x not in fixed_prefix
                  ]

                  final_items = fixed_prefix + current_items

                  # 新自动域名放在固定项之后。
                  for domain in new_real:
                      if domain not in final_items:
                          final_items.append(domain)

                  lines[real_index] = (
                      f"{prefix} = " + ", ".join(final_items)
                  )

          # ---------------------------
          # [Host] 彻底清除空行
          # ---------------------------

          host_start = None
          host_end = None

          for i, line in enumerate(lines):
              if line.strip().lower() == "[host]":
                  host_start = i
                  break

          if host_start is not None:
              for i in range(host_start + 1, len(lines)):
                  if lines[i].strip().startswith("[") and lines[i].strip().endswith("]"):
                      host_end = i
                      break

              if host_end is None:
                  host_end = len(lines)

              rebuilt_host = []

              for line in lines[host_start + 1:host_end]:
                  if line.strip():
                      rebuilt_host.append(line.strip())

              # 再次确保 *.cn 最后一行。
              rebuilt_host = [
                  x for x in rebuilt_host
                  if not x.startswith("*.cn =")
              ]

              rebuilt_host.append("*.cn = server:syslib")

              lines = (
                  lines[:host_start + 1]
                  + rebuilt_host
                  + lines[host_end:]
              )

          # ---------------------------
          # 最终写入
          # ---------------------------

          output = "\n".join(lines)

          # 删除文件末尾多余空行。
          output = output.rstrip() + "\n"

          CONFIG.write_text(
              output,
              encoding="utf-8",
          )

          print("\n========================================")
          print("SurgeGo.conf 更新完成")
          print(f"成功抓取公司: {success_count}/9")
          print(f"自动域名数量: {len(new_auto_keys)}")
          print("========================================")
          PY

      - name: Show changes
        run: |
          git diff -- SurgeGo.conf .github/surgego_auto_domains.json || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add SurgeGo.conf .github/surgego_auto_domains.json

          if git diff --cached --quiet; then
            echo "没有变化，不提交。"
            exit 0
          fi

          git commit -m "Auto update SurgeGo Host and always-real-ip"
          git push
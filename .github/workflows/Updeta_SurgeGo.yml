name: Update Surge [Host]&[aways_real_ip]

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update SurgeGo.conf
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          FILE = Path("SurgeGo.conf")
          text = FILE.read_text(encoding="utf-8")

          # ============================================================
          # [Host] 固定前置内容
          # ============================================================

          fixed_top = [
              "dns.alidns.com = 223.5.5.5",
              "doh.pub = 119.29.29.29",
              "*.lan = server:syslib",
              "*.local = server:syslib",
              "routerlogin.net = server:syslib",
              "*.asuscomm.com = server:syslib",
              "*.wicp.net = server:syslib",
          ]

          # ============================================================
          # 223.5.5.5
          # ============================================================

          ali_domains = [
              "*.alibaba.com",
              "*.taobao.com",
              "*.tmall.com",
              "*.goofish.com",
              "*.alipay.com",
              "*.alicdn.com",
              "*.tbcdn.cn",
              "*.taobaocdn.com",
          ]

          # ============================================================
          # 119.29.29.29
          # ============================================================

          tencent_domains = [
              "*.qq.com",
              "*.qqmail.com",
              "*.wechat.com",
              "*.weixin.qq.com",
              "*.tenpay.com",
              "*.mch.weixin.qq.com",
              "*.wx.tenpay.com",
              "*.qpic.cn",
              "*.jd.com",
              "*.jdpay.com",
              "*.360buyimg.com",
              "*.meituan.com",
              "*.meituan.net",
              "*.meituanpay.com",
              "*.dianping.com",
          ]

          # ============================================================
          # server:syslib
          # ============================================================

          syslib_groups = {
              "Apple": [
                  "*.apple.com",
                  "*.icloud.com",
                  "*.apps.apple.com",
                  "*.appleid.apple.com",
                  "*.push.apple.com",
                  "*.cdn-apple.com",
                  "*.mzstatic.com",
                  "*.apple-cloudkit.com",
              ],
              "抖音": [
                  "*.douyin.com",
                  "*.douyincdn.com",
                  "*.douyinpic.com",
                  "*.douyinstatic.com",
                  "*.douyinvod.com",
                  "*.amemv.com",
                  "*.snssdk.com",
                  "*.pstatp.com",
              ],
              "快手": [
                  "*.kuaishou.com",
                  "*.gifshow.com",
                  "*.yximgs.com",
                  "*.kwai.com",
              ],
              "小红书": [
                  "*.xiaohongshu.com",
                  "*.xhslink.com",
                  "*.xhslink.cn",
              ],
              "饿了么": [
                  "*.ele.me",
                  "*.elmapp.com",
                  "*.eleimg.com",
              ],
              "银行": [
                  "*.icbc.com.cn",
                  "*.abchina.com",
                  "*.boc.cn",
                  "*.ccb.com",
                  "*.bankcomm.com",
                  "*.cmbchina.com",
                  "*.cmbc.com.cn",
                  "*.psbc.com",
                  "*.citicbank.com",
                  "*.pingan.com",
              ],
              "数字人民币": [
                  "*.ecny.icbc.com",
                  "*.ecny.abchina.com",
                  "*.ecny.boc.cn",
                  "*.ecny.ccb.com",
              ],
              "银联": [
                  "*.unionpay.com",
                  "*.chinapay.com",
                  "*.95516.com",
                  "*.unionpayintl.com",
                  "*.unionpaysecure.com",
                  "*.online.unionpay.com",
              ],
              "NTP": [
                  "pool.ntp.org",
                  "*.pool.ntp.org",
                  "ntp.*.com",
                  "time.*.com",
              ],
          }

          # ============================================================
          # 生成域名
          # ============================================================

          used = set()
          generated = []
          generated_domains = []

          def add_group(name, domains, dns):
              for domain in domains:
                  domain = domain.strip()
                  if not domain:
                      continue

                  key = domain.lower()

                  if key in used:
                      continue

                  used.add(key)
                  generated_domains.append(domain)
                  generated.append(f"{domain} = {dns}")

          add_group("阿里 DNS", ali_domains, "223.5.5.5")
          add_group("腾讯 DNS", tencent_domains, "119.29.29.29")

          for name, domains in syslib_groups.items():
              add_group(name, domains, "server:syslib")

          # ============================================================
          # *.cn 永远最后
          # ============================================================

          generated_domains.append("*.cn")

          # ============================================================
          # 生成 [Host]
          # 不留空行
          # ============================================================

          host_lines = fixed_top + generated

          host_block = "[Host]\n" + "\n".join(host_lines)

          # ============================================================
          # 替换 [Host]
          # ============================================================

          host_pattern = r"\[Host\]\n.*?(?=\n\[[A-Za-z])"

          text, host_count = re.subn(
              host_pattern,
              host_block,
              text,
              count=1,
              flags=re.S
          )

          if host_count != 1:
              raise RuntimeError(
                  "没有找到 [Host] 区域，停止修改"
              )

          # ============================================================
          # always-real-ip
          #
          # 保留原有手写内容。
          # 自动生成域名使用特殊标记维护。
          # ============================================================

          auto_start = "# AUTO-HOST-REAL-IP-START"
          auto_end = "# AUTO-HOST-REAL-IP-END"

          auto_domains = generated_domains

          # 从原 always-real-ip 中删除旧自动区域
          text = re.sub(
              rf"\s*{re.escape(auto_start)}.*?{re.escape(auto_end)}",
              "",
              text,
              flags=re.S
          )

          # 找到 always-real-ip
          match = re.search(
              r"^always-real-ip\s*=\s*(.*)$",
              text,
              flags=re.M
          )

          if not match:
              raise RuntimeError(
                  "没有找到 always-real-ip"
              )

          current = match.group(1).strip()

          # 去除旧的自动域名
          current_items = [
              x.strip()
              for x in current.split(",")
              if x.strip()
          ]

          auto_keys = {
              x.lower()
              for x in auto_domains
          }

          manual_items = []

          for item in current_items:
              key = item.lower()

              if key in auto_keys:
                  continue

              if key.startswith("#"):
                  continue

              manual_items.append(item)

          # 去重
          final_items = []
          seen = set()

          for item in manual_items + auto_domains:
              key = item.lower()

              if key in seen:
                  continue

              seen.add(key)
              final_items.append(item)

          new_real_ip = (
              "always-real-ip = "
              + ", ".join(final_items)
          )

          text = re.sub(
              r"^always-real-ip\s*=.*$",
              new_real_ip,
              text,
              count=1,
              flags=re.M
          )

          # ============================================================
          # 清理 Host 区域中的连续空行
          # ============================================================

          text = re.sub(
              r"(\[Host\][\s\S]*?)(?:\n{2,})(?=\[[A-Za-z])",
              lambda m: m.group(1).rstrip("\n") + "\n",
              text,
              count=1
          )

          FILE.write_text(
              text,
              encoding="utf-8"
          )

          print("======================================")
          print("SurgeGo.conf 更新完成")
          print(f"自动 Host 域名: {len(generated_domains) - 1}")
          print("223.5.5.5: 阿里系")
          print("119.29.29.29: 腾讯系")
          print("server:syslib: 其他")
          print("NTP: 保留")
          print("Google: 删除")
          print("Telegram: 删除")
          print("Microsoft: 删除")
          print("*.cn: 最后")
          print("Host: 不留空行")
          print("======================================")
          PY

      - name: Show changes
        run: |
          git diff -- SurgeGo.conf

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SurgeGo.conf

          if git diff --cached --quiet; then
            echo "没有变化，不提交"
            exit 0
          fi

          git commit -m "Auto update Surge Host"
          git push
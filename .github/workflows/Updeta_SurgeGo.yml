name: Update_SurgeGo_[HOST]&[real-ip]

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update SurgeGo.conf
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          FILE = Path("SurgeGo.conf")

          FIXED = {
              "dns.alidns.com",
              "doh.pub",
              "*.lan",
              "*.local",
              "routerlogin.net",
              "*.asuscomm.com",
              "*.wicp.net",
          }

          GROUPS = {
              "223.5.5.5": [
                  "alipay.com",
                  "*.alipay.com",
                  "taobao.com",
                  "*.taobao.com",
                  "tmall.com",
                  "*.tmall.com",
                  "1688.com",
                  "*.1688.com",
                  "aliyun.com",
                  "*.aliyun.com",
                  "alibabacloud.com",
                  "*.alibabacloud.com",
                  "ele.me",
                  "*.ele.me",
              ],
              "119.29.29.29": [
                  "qq.com",
                  "*.qq.com",
                  "wechat.com",
                  "*.wechat.com",
                  "weixin.qq.com",
                  "*.weixin.qq.com",
                  "jd.com",
                  "*.jd.com",
                  "meituan.com",
                  "*.meituan.com",
                  "dianping.com",
                  "*.dianping.com",
              ],
              "server:syslib": [
                  "apple.com",
                  "*.apple.com",
                  "icloud.com",
                  "*.icloud.com",
                  "mzstatic.com",
                  "*.mzstatic.com",
                  "douyin.com",
                  "*.douyin.com",
                  "kuaishou.com",
                  "*.kuaishou.com",
                  "xiaohongshu.com",
                  "*.xiaohongshu.com",
                  "95516.com",
                  "*.95516.com",
              ],
          }

          NTP = [
              "pool.ntp.org",
              "*.pool.ntp.org",
              "ntp.*.com",
              "time.*.com",
          ]

          text = FILE.read_text(encoding="utf-8")
          lines = text.splitlines()

          host_start = next(
              i for i, line in enumerate(lines)
              if line.strip().lower() == "[host]"
          )

          section_end = len(lines)

          for i in range(host_start + 1, len(lines)):
              if re.match(r"^\s*\[[^\]]+\]\s*$", lines[i]):
                  section_end = i
                  break

          old_host = lines[host_start + 1:section_end]

          def domain_from_host_line(line):
              s = line.strip()

              if not s or s.startswith("#") or "=" not in s:
                  return None

              return s.split("=", 1)[0].strip().lower()

          old_auto_host = set()

          for line in old_host:
              domain = domain_from_host_line(line)

              if domain and domain not in FIXED and domain != "*.cn":
                  old_auto_host.add(domain)

          fixed_lines = []
          comments = []

          for line in old_host:
              s = line.strip()

              if not s:
                  continue

              if s.startswith("#"):
                  comments.append(line)
                  continue

              domain = domain_from_host_line(line)

              if domain in FIXED:
                  fixed_lines.append(line)

          generated = []

          for dns, domains in GROUPS.items():
              for domain in domains:
                  generated.append(f"{domain} = {dns}")

          for domain in NTP:
              generated.append(f"{domain} = server:syslib")

          seen = set()
          generated_unique = []

          for line in generated:
              domain = domain_from_host_line(line)

              if not domain or domain in seen:
                  continue

              seen.add(domain)
              generated_unique.append(line)

          new_host = []

          for line in comments:
              if line.strip():
                  new_host.append(line)

          for line in fixed_lines:
              if line.strip():
                  new_host.append(line)

          new_host.extend(generated_unique)
          new_host.append("*.cn = server:syslib")

          lines = lines[:host_start + 1] + new_host + lines[section_end:]
          text = "\n".join(lines) + "\n"

          match = re.search(
              r"(?mi)^always-real-ip\s*=\s*(.*)$",
              text
          )

          if match:
              old_value = match.group(1).strip()

              items = [
                  x.strip()
                  for x in old_value.split(",")
                  if x.strip()
              ]

              manual = []

              for item in items:
                  domain = item.split("//", 1)[0].strip().lower()

                  if domain in old_auto_host:
                      continue

                  if domain in {
                      "%insert%",
                      "*.lan",
                      "*.cn",
                  }:
                      continue

                  manual.append(item)

              auto_real_ip = []

              for line in generated_unique:
                  domain = domain_from_host_line(line)

                  if domain:
                      auto_real_ip.append(domain)

              result = []
              seen = set()

              for item in ["%INSERT%", "*.lan", "*.cn"] + manual + auto_real_ip:
                  key = item.lower()

                  if key in seen:
                      continue

                  seen.add(key)
                  result.append(item)

              text = re.sub(
                  r"(?mi)^always-real-ip\s*=\s*.*$",
                  "always-real-ip = " + ", ".join(result),
                  text,
                  count=1,
              )

          FILE.write_text(text, encoding="utf-8")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add SurgeGo.conf

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update SurgeGo [HOST] & [real-ip]"
          git push
name: Update_SurgeGo_[HOST]&[real-ip]

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update SurgeGo.conf
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import urllib.request

          FILE = Path("SurgeGo.conf")

          FIXED = {
              "dns.alidns.com",
              "doh.pub",
              "*.lan",
              "*.local",
              "routerlogin.net",
              "*.asuscomm.com",
              "*.wicp.net",
          }

          SOURCES = {
              "223.5.5.5": [
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Alibaba/Alibaba.list",
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/AliPay/AliPay.list",
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Eleme/Eleme.list",
              ],
              "119.29.29.29": [
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Tencent/Tencent.list",
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/JingDong/JingDong.list",
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/MeiTuan/MeiTuan.list",
              ],
              "server:syslib": [
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Apple/Apple.list",
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/DouYin/DouYin.list",
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Kuaishou/Kuaishou.list",
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/XiaoHongShu/XiaoHongShu.list",
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/UnionPay/UnionPay.list",
              ],
          }

          NTP = [
              "pool.ntp.org",
              "*.pool.ntp.org",
              "ntp.*.com",
              "time.*.com",
          ]

          def download(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.read().decode(
                      "utf-8",
                      errors="ignore"
                  )

          def parse_rules(text):
              suffixes = set()
              domains = set()

              for raw in text.splitlines():
                  line = raw.strip()

                  if not line or line.startswith("#"):
                      continue

                  parts = [x.strip() for x in line.split(",")]

                  if len(parts) < 2:
                      continue

                  rule_type = parts[0].upper()
                  value = parts[1].lower().strip()

                  if rule_type == "DOMAIN-SUFFIX":
                      if (
                          value
                          and "*" not in value
                          and "/" not in value
                          and "." in value
                      ):
                          suffixes.add(value)

                  elif rule_type == "DOMAIN":
                      if (
                          value
                          and "*" not in value
                          and "/" not in value
                          and "." in value
                      ):
                          domains.add(value)

              return suffixes, domains

          def is_subdomain(domain, suffix):
              return (
                  domain == suffix
                  or domain.endswith("." + suffix)
              )

          def minimize(suffixes, domains):
              suffixes = {
                  x.lower().lstrip(".")
                  for x in suffixes
                  if x and "." in x
              }

              domains = {
                  x.lower().lstrip(".")
                  for x in domains
                  if x and "." in x
              }

              # 只保留最顶层、最核心的后缀
              core = set()

              for suffix in sorted(
                  suffixes,
                  key=lambda x: (x.count("."), len(x))
              ):
                  covered = False

                  for parent in core:
                      if is_subdomain(suffix, parent):
                          covered = True
                          break

                  if not covered:
                      core.add(suffix)

              result = set()

              # DOMAIN-SUFFIX → Surge Host 通配后缀
              for suffix in core:
                  result.add("*." + suffix)

              # 只有没有被核心后缀覆盖的 DOMAIN 才保留
              for domain in domains:
                  covered = False

                  for suffix in core:
                      if is_subdomain(domain, suffix):
                          covered = True
                          break

                  if not covered:
                      result.add(domain)

              return sorted(
                  result,
                  key=lambda x: (
                      x.count("."),
                      x.lower()
                  )
              )

          def host_domain(line):
              line = line.strip()

              if (
                  not line
                  or line.startswith("#")
                  or "=" not in line
              ):
                  return None

              return line.split("=", 1)[0].strip().lower()

          text = FILE.read_text(encoding="utf-8")
          lines = text.splitlines()

          try:
              host_start = next(
                  i for i, line in enumerate(lines)
                  if line.strip().lower() == "[host]"
              )
          except StopIteration:
              raise RuntimeError("[Host] 不存在")

          section_end = len(lines)

          for i in range(host_start + 1, len(lines)):
              if re.match(
                  r"^\s*\[[^\]]+\]\s*$",
                  lines[i]
              ):
                  section_end = i
                  break

          old_host = lines[
              host_start + 1:section_end
          ]

          old_auto_host = set()
          comments = []
          fixed_lines = []

          for line in old_host:
              stripped = line.strip()

              if not stripped:
                  continue

              if stripped.startswith("#"):
                  comments.append(line)
                  continue

              domain = host_domain(line)

              if not domain:
                  continue

              if domain in FIXED:
                  fixed_lines.append(line)
              elif domain != "*.cn":
                  old_auto_host.add(domain)

          generated_by_dns = {}

          for dns, urls in SOURCES.items():
              suffixes = set()
              domains = set()

              for url in urls:
                  try:
                      content = download(url)
                      s, d = parse_rules(content)
                      suffixes.update(s)
                      domains.update(d)

                      print(
                          f"OK: {url} "
                          f"suffix={len(s)} "
                          f"domain={len(d)}"
                      )

                  except Exception as e:
                      print(f"FAILED: {url}")
                      print(e)

              minimized = minimize(
                  suffixes,
                  domains
              )

              generated_by_dns[dns] = minimized

          total = sum(
              len(v)
              for v in generated_by_dns.values()
          )

          if total == 0:
              raise RuntimeError(
                  "没有抓取到有效核心域名，"
                  "停止更新以保护现有配置"
              )

          generated = []

          for dns, domains in generated_by_dns.items():
              for domain in domains:
                  generated.append(
                      f"{domain} = {dns}"
                  )

          for domain in NTP:
              generated.append(
                  f"{domain} = server:syslib"
              )

          # 去重
          unique_generated = []
          seen = set()

          for line in generated:
              domain = host_domain(line)

              if not domain:
                  continue

              if domain in seen:
                  continue

              seen.add(domain)
              unique_generated.append(line)

          # 重建 [Host]
          new_host = []

          for line in comments:
              if line.strip():
                  new_host.append(line)

          for line in fixed_lines:
              if line.strip():
                  new_host.append(line)

          new_host.extend(unique_generated)

          # 必须最后
          new_host.append(
              "*.cn = server:syslib"
          )

          lines = (
              lines[:host_start + 1]
              + new_host
              + lines[section_end:]
          )

          text = "\n".join(lines) + "\n"

          # 更新 always-real-ip
          match = re.search(
              r"(?mi)^always-real-ip\s*=\s*(.*)$",
              text
          )

          if match:
              old_value = match.group(1).strip()

              manual = []

              for item in old_value.split(","):
                  item = item.strip()

                  if not item:
                      continue

                  domain = item.split(
                      "//", 1
                  )[0].strip().lower()

                  # 删除上一轮自动生成的域名
                  if domain in old_auto_host:
                      continue

                  if domain in {
                      "%insert%",
                      "*.lan",
                      "*.cn",
                  }:
                      continue

                  manual.append(item)

              auto = []

              for line in unique_generated:
                  domain = host_domain(line)

                  if domain:
                      auto.append(domain)

              result = []
              seen = set()

              for item in (
                  ["%INSERT%", "*.lan", "*.cn"]
                  + manual
                  + auto
              ):
                  key = item.lower()

                  if key in seen:
                      continue

                  seen.add(key)
                  result.append(item)

              text = re.sub(
                  r"(?mi)^always-real-ip\s*=\s*.*$",
                  "always-real-ip = "
                  + ", ".join(result),
                  text,
                  count=1
              )

          FILE.write_text(
              text,
              encoding="utf-8"
          )

          print()
          print("================================")
          print("SurgeGo 更新完成")
          print("核心自动域名:", total)
          print("最终 Host 自动项:", len(unique_generated))
          print("================================")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add SurgeGo.conf

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update SurgeGo [HOST] & [real-ip]"
          git push
name: Update_SurgeGo_[HOST]&[real-ip]

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update SurgeGo.conf
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import urllib.request

          FILE = Path("SurgeGo.conf")

          FIXED = {
              "dns.alidns.com",
              "doh.pub",
              "*.lan",
              "*.local",
              "routerlogin.net",
              "*.asuscomm.com",
              "*.wicp.net",
          }

          SOURCES = {
              "223.5.5.5": [
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Alibaba/Alibaba.list",
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/AliPay/AliPay.list",
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Eleme/Eleme.list",
              ],
              "119.29.29.29": [
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Tencent/Tencent.list",
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/JingDong/JingDong.list",
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/MeiTuan/MeiTuan.list",
              ],
              "server:syslib": [
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Apple/Apple.list",
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/DouYin/DouYin.list",
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Kuaishou/Kuaishou.list",
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/XiaoHongShu/XiaoHongShu.list",
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/UnionPay/UnionPay.list",
              ],
          }

          NTP = [
              "pool.ntp.org",
              "*.pool.ntp.org",
              "ntp.*.com",
              "time.*.com",
          ]

          def download(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode("utf-8", errors="ignore")

          def extract_domains(text):
              result = set()

              for raw in text.splitlines():
                  line = raw.strip()

                  if not line or line.startswith("#"):
                      continue

                  parts = [x.strip() for x in line.split(",")]

                  if len(parts) < 2:
                      continue

                  rule_type = parts[0].upper()
                  domain = parts[1].lower()

                  if rule_type not in {"DOMAIN", "DOMAIN-SUFFIX"}:
                      continue

                  if not domain or "/" in domain:
                      continue

                  if domain.startswith("."):
                      domain = "*" + domain

                  if "*" in domain and not domain.startswith("*."):
                      continue

                  result.add(domain)

              return result

          def base_domain(domain):
              if domain.startswith("*."):
                  domain = domain[2:]

              parts = domain.split(".")

              if len(parts) < 2:
                  return domain

              return ".".join(parts[-2:])

          def compact_domains(domains):
              domains = {
                  d.lower()
                  for d in domains
                  if d and d not in FIXED and d != "*.cn"
              }

              exact = {
                  d for d in domains
                  if not d.startswith("*.")
              }

              wildcards = {
                  d[2:] for d in domains
                  if d.startswith("*.")
              }

              result = set()

              for domain in exact:
                  parts = domain.split(".")

                  covered = False

                  for i in range(len(parts) - 1):
                      suffix = ".".join(parts[i + 1:])

                      if suffix in wildcards:
                          covered = True
                          break

                  if not covered:
                      result.add(domain)

              result.update(
                  "*" + "." + d
                  for d in wildcards
              )

              return sorted(result)

          text = FILE.read_text(encoding="utf-8")
          lines = text.splitlines()

          try:
              host_start = next(
                  i for i, line in enumerate(lines)
                  if line.strip().lower() == "[host]"
              )
          except StopIteration:
              raise RuntimeError("[Host] 不存在")

          section_end = len(lines)

          for i in range(host_start + 1, len(lines)):
              if re.match(r"^\s*\[[^\]]+\]\s*$", lines[i]):
                  section_end = i
                  break

          old_host = lines[host_start + 1:section_end]

          def get_domain(line):
              s = line.strip()

              if not s or s.startswith("#") or "=" not in s:
                  return None

              return s.split("=", 1)[0].strip().lower()

          old_auto_host = set()

          for line in old_host:
              domain = get_domain(line)

              if domain and domain not in FIXED and domain != "*.cn":
                  old_auto_host.add(domain)

          comments = []
          fixed_lines = []

          for line in old_host:
              s = line.strip()

              if not s:
                  continue

              if s.startswith("#"):
                  comments.append(line)
                  continue

              domain = get_domain(line)

              if domain in FIXED:
                  fixed_lines.append(line)

          generated_by_dns = {}

          for dns, urls in SOURCES.items():
              domains = set()

              for url in urls:
                  try:
                      content = download(url)
                      domains.update(extract_domains(content))
                  except Exception as e:
                      print(f"跳过: {url}")
                      print(e)

              domains = compact_domains(domains)

              generated_by_dns[dns] = domains

          generated = []

          for dns, domains in generated_by_dns.items():
              for domain in domains:
                  generated.append(f"{domain} = {dns}")

          for domain in NTP:
              generated.append(f"{domain} = server:syslib")

          if not generated:
              raise RuntimeError(
                  "没有抓取到有效域名，停止更新"
              )

          new_host = []

          for line in comments:
              if line.strip():
                  new_host.append(line)

          for line in fixed_lines:
              if line.strip():
                  new_host.append(line)

          new_host.extend(generated)
          new_host.append("*.cn = server:syslib")

          lines = (
              lines[:host_start + 1]
              + new_host
              + lines[section_end:]
          )

          text = "\n".join(lines) + "\n"

          match = re.search(
              r"(?mi)^always-real-ip\s*=\s*(.*)$",
              text
          )

          if match:
              old_value = match.group(1).strip()

              manual = []

              for item in old_value.split(","):
                  item = item.strip()

                  if not item:
                      continue

                  domain = item.split("//", 1)[0].strip().lower()

                  if domain in old_auto_host:
                      continue

                  if domain in {
                      "%insert%",
                      "*.lan",
                      "*.cn",
                  }:
                      continue

                  manual.append(item)

              auto_real_ip = []

              for line in generated:
                  domain = get_domain(line)

                  if domain:
                      auto_real_ip.append(domain)

              result = []
              seen = set()

              for item in (
                  ["%INSERT%", "*.lan", "*.cn"]
                  + manual
                  + auto_real_ip
              ):
                  key = item.lower()

                  if key in seen:
                      continue

                  seen.add(key)
                  result.append(item)

              text = re.sub(
                  r"(?mi)^always-real-ip\s*=\s*.*$",
                  "always-real-ip = " + ", ".join(result),
                  text,
                  count=1
              )

          FILE.write_text(text, encoding="utf-8")

          total = sum(
              len(v) for v in generated_by_dns.values()
          )

          print(f"动态抓取并整理完成，共 {total} 个域名")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add SurgeGo.conf

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update SurgeGo [HOST] & [real-ip]"
          git push
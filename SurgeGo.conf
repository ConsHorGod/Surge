# 𖦝𖦝𖦝𖦝️𖦝️𖦝️𖦝𖦝𖦝𖦝️本地DNS映射(true執行,false禁止)
use-local-host-item-for-proxy = true
# 𖦝𖦝𖦝𖦝️𖦝️𖦝️𖦝𖦝𖦝𖦝️DNS伺服器
dns-server = system
# 𖦝𖦝𖦝𖦝️𖦝️𖦝️𖦝𖦝𖦝𖦝️加密DNS伺服器
encrypted-dns-server = https://dns.alidns.com/dns-query, https://doh.pub/dns-query
# 𖦝𖦝𖦝𖦝️𖦝️𖦝️𖦝𖦝𖦝𖦝️加密DNS查詢按分流規則出站(true執行,false禁止)
encrypted-dns-follow-outbound-mode = false
# 𖦝𖦝𖦝𖦝️𖦝️𖦝️𖦝𖦝𖦝𖦝️DNS劫持,強制所有DNS請求透過Surge處理
hijack-dns = *:53
# 𖦝𖦝𖦝𖦝️𖦝️𖦝️𖦝𖦝𖦝𖦝️从Host文件读取DNS
read-etc-hosts = false
# 𖦝𖦝𖦝𖦝️𖦝️𖦝️𖦝𖦝𖦝𖦝️路由接管模式
compatibility-mode = 1
# 0: Auto,兼容性最好,最均衡(標準接管模式(即:TUN增強模式)
# 1: System_Proxy+VIF,代理接管優先,速度最快,兼容性稍差。部分應用會強制繞過系統代理,導致無法翻牆。
# 5: System_Proxy+VIF(No Default Route),特定兼容,僅當你遇到HomeKit攝像頭無法連接等問題時使用。

